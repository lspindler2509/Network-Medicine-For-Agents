name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - run: uv sync --locked --group lint
      - run: uv run --group lint ruff check .
      - run: uv run --group lint ruff format --check .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NETMED_PROCESS_TESTS: "1"
      NETMED_RESTISH_TESTS: "1"
      NETMED_GRAPHQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Prepare isolated pinned-Fire worker for result contract tests
        run: python -c "import os,pathlib,subprocess,venv; root=pathlib.Path('.build/test-worker').resolve(); venv.create(root,with_pip=True); worker=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.run([str(worker),'-m','pip','install','fire==0.7.1'],check=True); open(os.environ['GITHUB_ENV'],'a').write('NETMED_WORKER_PYTHON='+str(worker)+'\n')"
      - run: python -m unittest discover -s tests -v
