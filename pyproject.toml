[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-medicine-for-agents"
version = "0.0.1"
description = "Generate agent-friendly CLI access to packages, OpenAPI and GraphQL services."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6,<7",
    "psutil>=7.2,<8",
    "graphql-core>=3.2.6,<3.3",
]

[project.scripts]
netmed = "netmed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netmed"]

[dependency-groups]
build = ["pyinstaller==6.22.3"]

lint = ["ruff==0.14.0"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff]
cache-dir = ".build/ruff"
exclude = [".build", ".netmed", "dist"]
